name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init -- --ci

      - name: Configure release signing
        working-directory: src-tauri/gen/android/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle.kts")
          text = path.read_text()

          marker = '        getByName("release") {'

          if marker not in text:
              raise SystemExit(
                  'Could not find the Tauri Android release build type '
                  'in app/build.gradle.kts'
              )

          signing = '            signingConfig = signingConfigs.getByName("debug")'

          if signing not in text:
              text = text.replace(
                  marker + '\n',
                  marker + '\n' + signing + '\n',
                  1
              )
              path.write_text(text)

          print("Release build will use the default Android debug signing key.")
          PY

      - name: Build ARM64 release APK
        run: npm run tauri android build -- --apk --target aarch64

      - name: Find ARM64 APK
        id: apk
        run: |
          echo "Generated APK files:"
          find src-tauri/gen/android/app/build/outputs \
            -type f \
            -name '*.apk' \
            -print

          APK="$(find src-tauri/gen/android/app/build/outputs \
            -type f \
            -name '*.apk' \
            -path '*release*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was produced."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "Using APK: $APK"

      - name: Verify APK
        run: |
          APK="${{ steps.apk.outputs.APK }}"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: synced-plus-android-arm64
          path: ${{ steps.apk.outputs.APK }}
          if-no-files-found: error